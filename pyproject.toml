[project]
name = "aero-voice-bot"
version = "0.1.0"
description = "Multilingual low-latency voice bot using Pipecat + Sarvam AI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pipecat-ai[sarvam,google,openai,groq,silero,runner]",
    "python-dotenv>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
